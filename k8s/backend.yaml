apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bug-finder-pro
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/bug-finder-pro/backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: MAX_CONCURRENT_SCANS
              value: "3"
            - name: MAX_CONCURRENT_AI
              value: "5"
            - name: MAX_QUEUE_SIZE
              value: "100"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: bfp-secrets
                  key: mongodb-uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: bfp-secrets
                  key: session-secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: bfp-secrets
                  key: redis-url
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bfp-secrets
                  key: opencode-api-key
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: bfp-config
                  key: allowed-origins
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bug-finder-pro
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: bug-finder-pro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
