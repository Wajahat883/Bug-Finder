# POINT 11: Kubernetes Secrets — replace base64 values with: echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: bfp-secrets
  namespace: bug-finder-pro
type: Opaque
data:
  # echo -n "mongodb://mongo:27017/bugfinderpro" | base64
  mongodb-uri: bW9uZ29kYjovL21vbmdvOjI3MDE3L2J1Z2ZpbmRlcnBybw==
  # echo -n "change-me-production-secret-min-32-chars" | base64
  session-secret: Y2hhbmdlLW1lLXByb2R1Y3Rpb24tc2VjcmV0LW1pbi0zMi1jaGFycw==
  # echo -n "redis://redis:6379" | base64
  redis-url: cmVkaXM6Ly9yZWRpczo2Mzc5
  # echo -n "your-opencode-api-key" | base64
  opencode-api-key: eW91ci1vcGVuY29kZS1hcGkta2V5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bfp-config
  namespace: bug-finder-pro
data:
  allowed-origins: "https://bugfinderpro.example.com"
  log-level: "info"
  max-concurrent-scans: "3"
