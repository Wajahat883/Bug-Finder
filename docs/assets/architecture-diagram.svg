<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#1e1e2e" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
  </g>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="28" font-weight="700">
    Bug Finder Pro — System Architecture
  </text>
  <text x="600" y="75" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="14">
    Dark Command Center Visual Overview
  </text>

  <!-- Client Layer -->
  <g transform="translate(100, 120)">
    <rect width="300" height="140" rx="12" fill="#111118" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="30" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="16" font-weight="600">Client Layer</text>
    <rect x="20" y="45" width="80" height="30" rx="6" fill="#1e1e2e" stroke="#7c3aed40" stroke-width="1"/>
    <text x="60" y="65" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="11">React SPA</text>
    <rect x="110" y="45" width="80" height="30" rx="6" fill="#1e1e2e" stroke="#7c3aed40" stroke-width="1"/>
    <text x="150" y="65" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="11">TanStack</text>
    <rect x="200" y="45" width="80" height="30" rx="6" fill="#1e1e2e" stroke="#7c3aed40" stroke-width="1"/>
    <text x="240" y="65" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="11">SSE</text>
    
    <rect x="20" y="85" width="260" height="35" rx="6" fill="#0a0a0f" stroke="#22d3ee40" stroke-width="1"/>
    <text x="150" y="108" text-anchor="middle" fill="#22d3ee" font-family="'Space Mono', monospace" font-size="12">
      Vite + TypeScript + Tailwind
    </text>
  </g>

  <!-- Nginx -->
  <g transform="translate(500, 120)">
    <rect width="200" height="140" rx="12" fill="#111118" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" text-anchor="middle" fill="#22d3ee" font-family="Inter, sans-serif" font-size="16" font-weight="600">Nginx Proxy</text>
    <text x="100" y="55" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Port 3000</text>
    <rect x="20" y="70" width="160" height="25" rx="4" fill="#0a0a0f" stroke="#22d3ee30" stroke-width="1"/>
    <text x="100" y="87" text-anchor="middle" fill="#e8e8ef" font-family="'Space Mono', monospace" font-size="10">/api/* → API :5000</text>
    <rect x="20" y="100" width="160" height="25" rx="4" fill="#0a0a0f" stroke="#22d3ee30" stroke-width="1"/>
    <text x="100" y="117" text-anchor="middle" fill="#e8e8ef" font-family="'Space Mono', monospace" font-size="10">/ → Static SPA</text>
  </g>

  <!-- API Server -->
  <g transform="translate(800, 120)">
    <rect width="300" height="140" rx="12" fill="#111118" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="30" text-anchor="middle" fill="#f97316" font-family="Inter, sans-serif" font-size="16" font-weight="600">API Server</text>
    <text x="150" y="55" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Express + Node.js :5000</text>
    <rect x="20" y="65" width="80" height="25" rx="4" fill="#0a0a0f" stroke="#f9731630" stroke-width="1"/>
    <text x="60" y="82" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="10">Routes</text>
    <rect x="110" y="65" width="80" height="25" rx="4" fill="#0a0a0f" stroke="#f9731630" stroke-width="1"/>
    <text x="150" y="82" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="10">Services</text>
    <rect x="200" y="65" width="80" height="25" rx="4" fill="#0a0a0f" stroke="#f9731630" stroke-width="1"/>
    <text x="240" y="82" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="10">Scanner</text>
    <rect x="20" y="100" width="260" height="25" rx="4" fill="#0a0a0f" stroke="#f9731630" stroke-width="1"/>
    <text x="150" y="117" text-anchor="middle" fill="#e8e8ef" font-family="'Space Mono', monospace" font-size="10">Session + CORS + pino-http</text>
  </g>

  <!-- Database -->
  <g transform="translate(100, 320)">
    <rect width="200" height="120" rx="12" fill="#111118" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="16" font-weight="600">MongoDB</text>
    <text x="100" y="55" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Port 27017</text>
    <rect x="20" y="70" width="160" height="35" rx="4" fill="#0a0a0f" stroke="#10b98130" stroke-width="1"/>
    <text x="100" y="87" text-anchor="middle" fill="#e8e8ef" font-family="'Space Mono', monospace" font-size="10">users · scans · findings</text>
    <text x="100" y="102" text-anchor="middle" fill="#e8e8ef" font-family="'Space Mono', monospace" font-size="10">targets · audit · sessions</text>
  </g>

  <!-- OWASP ZAP -->
  <g transform="translate(350, 320)">
    <rect width="200" height="120" rx="12" fill="#111118" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="16" font-weight="600">OWASP ZAP</text>
    <text x="100" y="55" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Active Scanner :8080</text>
    <rect x="20" y="70" width="160" height="35" rx="4" fill="#0a0a0f" stroke="#ef444430" stroke-width="1"/>
    <text x="100" y="92" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="11">Spider → Ascan → Alerts</text>
  </g>

  <!-- AI Service -->
  <g transform="translate(600, 320)">
    <rect width="200" height="120" rx="12" fill="#111118" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" text-anchor="middle" fill="#8b5cf6" font-family="Inter, sans-serif" font-size="16" font-weight="600">OpenCode AI</text>
    <text x="100" y="55" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">nemotron-3-super-free</text>
    <rect x="20" y="70" width="160" height="35" rx="4" fill="#0a0a0f" stroke="#8b5cf630" stroke-width="1"/>
    <text x="100" y="87" text-anchor="middle" fill="#e8e8ef" font-family="'Space Mono', monospace" font-size="10">Streaming SSE</text>
    <text x="100" y="102" text-anchor="middle" fill="#e8e8ef" font-family="'Space Mono', monospace" font-size="10">Retries + Heartbeat</text>
  </g>

  <!-- Scheduler -->
  <g transform="translate(850, 320)">
    <rect width="200" height="120" rx="12" fill="#111118" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" text-anchor="middle" fill="#eab308" font-family="Inter, sans-serif" font-size="16" font-weight="600">Scheduler</text>
    <text x="100" y="55" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">node-cron</text>
    <rect x="20" y="70" width="160" height="35" rx="4" fill="#0a0a0f" stroke="#eab30830" stroke-width="1"/>
    <text x="100" y="87" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="10">Scheduled Scans</text>
    <text x="100" y="102" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="10">SLA Enforcement</text>
  </g>

  <!-- Flow Arrows -->
  <!-- Client to Nginx -->
  <path d="M 420 190 L 490 190" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="455" y="180" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">HTTP</text>

  <!-- Nginx to API -->
  <path d="M 710 190 L 790 190" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="750" y="180" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">/api/*</text>

  <!-- API to MongoDB -->
  <path d="M 850 260 L 850 300 L 210 300 L 210 320" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="250" y="295" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">CRUD</text>

  <!-- API to ZAP -->
  <path d="M 900 260 L 900 290 L 460 290 L 460 320" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="500" y="295" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">REST API</text>

  <!-- API to AI -->
  <path d="M 950 260 L 950 280 L 710 280 L 710 320" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="750" y="295" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Stream</text>

  <!-- API to Scheduler -->
  <path d="M 1000 260 L 1000 270 L 960 270 L 960 320" stroke="#eab308" stroke-width="2" fill="none" marker-end="url(#arrowYellow)"/>

  <!-- Features Grid -->
  <g transform="translate(100, 500)">
    <text x="0" y="-15" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="18" font-weight="600">Key Capabilities</text>
    
    <g transform="translate(0, 20)">
      <rect width="180" height="80" rx="8" fill="#111118" stroke="#7c3aed40" stroke-width="1"/>
      <text x="90" y="25" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">🔍 60+ Scanners</text>
      <text x="90" y="45" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Injection, Auth, Cloud</text>
      <text x="90" y="62" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Recon, Infrastructure</text>
    </g>

    <g transform="translate(200, 20)">
      <rect width="180" height="80" rx="8" fill="#111118" stroke="#22d3ee40" stroke-width="1"/>
      <text x="90" y="25" text-anchor="middle" fill="#22d3ee" font-family="Inter, sans-serif" font-size="14" font-weight="600">⚡ Real-Time SSE</text>
      <text x="90" y="45" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Live findings stream</text>
      <text x="90" y="62" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Progress + AI tokens</text>
    </g>

    <g transform="translate(400, 20)">
      <rect width="180" height="80" rx="8" fill="#111118" stroke="#8b5cf640" stroke-width="1"/>
      <text x="90" y="25" text-anchor="middle" fill="#8b5cf6" font-family="Inter, sans-serif" font-size="14" font-weight="600">🤖 AI Analysis</text>
      <text x="90" y="45" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Executive summaries</text>
      <text x="90" y="62" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Remediation advice</text>
    </g>

    <g transform="translate(600, 20)">
      <rect width="180" height="80" rx="8" fill="#111118" stroke="#ef444440" stroke-width="1"/>
      <text x="90" y="25" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="14" font-weight="600">📊 Executive Reports</text>
      <text x="90" y="45" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Risk posture scoring</text>
      <text x="90" y="62" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">PDF export + charts</text>
    </g>

    <g transform="translate(800, 20)">
      <rect width="180" height="80" rx="8" fill="#111118" stroke="#eab30840" stroke-width="1"/>
      <text x="90" y="25" text-anchor="middle" fill="#eab308" font-family="Inter, sans-serif" font-size="14" font-weight="600">⏱️ SLA Tracking</text>
      <text x="90" y="45" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Auto deadlines</text>
      <text x="90" y="62" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Breach alerts</text>
    </g>
  </g>

  <!-- Severity Legend -->
  <g transform="translate(100, 640)">
    <text x="0" y="-10" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="14" font-weight="600">Severity Scale</text>
    <circle cx="20" cy="20" r="8" fill="#ef4444"/>
    <text x="40" y="25" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">Critical</text>
    
    <circle cx="120" cy="20" r="8" fill="#f97316"/>
    <text x="140" y="25" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">High</text>
    
    <circle cx="210" cy="20" r="8" fill="#eab308"/>
    <text x="230" y="25" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">Medium</text>
    
    <circle cx="310" cy="20" r="8" fill="#22d3ee"/>
    <text x="330" y="25" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">Low</text>
    
    <circle cx="390" cy="20" r="8" fill="#34d399"/>
    <text x="410" y="25" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">Info</text>
  </g>

  <!-- Footer -->
  <text x="600" y="780" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="12">
    Bug Finder Pro Architecture Diagram — Generated for Design Documentation
  </text>

  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#eab308"/>
    </marker>
  </defs>
</svg>
