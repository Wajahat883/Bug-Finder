<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="22" font-weight="700">
    Bug Finder Pro — UI Component Showcase
  </text>
  <text x="600" y="65" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="12">
    Design System Visual Reference
  </text>

  <!-- ========== BUTTONS ========== -->
  <g transform="translate(50, 90)">
    <text x="0" y="0" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Buttons</text>
    
    <!-- Primary -->
    <rect x="0" y="15" width="140" height="36" rx="6" fill="#7c3aed" filter="url(#shadow)"/>
    <text x="70" y="38" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="500">Primary Action</text>
    
    <!-- Secondary -->
    <rect x="155" y="15" width="140" height="36" rx="6" fill="#1e1e2e" stroke="#3f3f55" stroke-width="1" filter="url(#shadow)"/>
    <text x="225" y="38" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="13" font-weight="500">Secondary</text>
    
    <!-- Ghost -->
    <rect x="310" y="15" width="100" height="36" rx="6" fill="transparent" stroke="#7c3aed60" stroke-width="1"/>
    <text x="360" y="38" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="13" font-weight="500">Ghost</text>
    
    <!-- Destructive -->
    <rect x="425" y="15" width="120" height="36" rx="6" fill="#ef4444" filter="url(#shadow)"/>
    <text x="485" y="38" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="500">Delete</text>
    
    <!-- Small -->
    <rect x="560" y="20" width="80" height="28" rx="4" fill="#7c3aed" opacity="0.8"/>
    <text x="600" y="39" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="500">Small</text>
  </g>

  <!-- ========== BADGES ========== -->
  <g transform="translate(50, 160)">
    <text x="0" y="0" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Severity Badges</text>
    
    <rect x="0" y="15" width="80" height="26" rx="4" fill="#ef444420" stroke="#ef444440" stroke-width="1"/>
    <circle cx="18" cy="28" r="4" fill="#ef4444"/>
    <text x="50" y="32" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="11" font-weight="600">Critical</text>
    
    <rect x="90" y="15" width="60" height="26" rx="4" fill="#f9731620" stroke="#f9731640" stroke-width="1"/>
    <circle cx="108" cy="28" r="4" fill="#f97316"/>
    <text x="130" y="32" text-anchor="middle" fill="#f97316" font-family="Inter, sans-serif" font-size="11" font-weight="600">High</text>
    
    <rect x="160" y="15" width="70" height="26" rx="4" fill="#eab30820" stroke="#eab30840" stroke-width="1"/>
    <circle cx="178" cy="28" r="4" fill="#eab308"/>
    <text x="205" y="32" text-anchor="middle" fill="#eab308" font-family="Inter, sans-serif" font-size="11" font-weight="600">Medium</text>
    
    <rect x="240" y="15" width="55" height="26" rx="4" fill="#22d3ee20" stroke="#22d3ee40" stroke-width="1"/>
    <circle cx="255" cy="28" r="4" fill="#22d3ee"/>
    <text x="275" y="32" text-anchor="middle" fill="#22d3ee" font-family="Inter, sans-serif" font-size="11" font-weight="600">Low</text>
    
    <rect x="305" y="15" width="55" height="26" rx="4" fill="#34d39920" stroke="#34d39940" stroke-width="1"/>
    <circle cx="320" cy="28" r="4" fill="#34d399"/>
    <text x="340" y="32" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="600">Info</text>
  </g>

  <!-- ========== CARDS ========== -->
  <g transform="translate(50, 230)">
    <text x="0" y="0" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Cards</text>
    
    <!-- Metric Card -->
    <rect x="0" y="15" width="200" height="110" rx="8" fill="#111118" stroke="#1e1e2e" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="38" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Total Findings</text>
    <text x="15" y="70" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="32" font-weight="700">1,247</text>
    <text x="15" y="95" fill="#34d399" font-family="Inter, sans-serif" font-size="11">↑ 12% vs last week</text>
    <rect x="140" y="35" width="45" height="45" rx="6" fill="#7c3aed20"/>
    <text x="162" y="63" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="18">📊</text>
    
    <!-- Finding Card -->
    <rect x="215" y="15" width="280" height="110" rx="8" fill="#111118" stroke="#1e1e2e" stroke-width="1" filter="url(#shadow)"/>
    <rect x="230" y="30" width="60" height="20" rx="4" fill="#ef444420" stroke="#ef444440" stroke-width="1"/>
    <text x="260" y="44" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="600">CRITICAL</text>
    <text x="230" y="68" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="13" font-weight="600">SQL Injection in 'id' Parameter</text>
    <text x="230" y="88" fill="#6b6b80" font-family="'Space Mono', monospace" font-size="10">/api/users?id=1' OR '1'='1</text>
    <text x="230" y="108" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">CVSS: 9.8 | CWE-89</text>
    
    <!-- Info Card -->
    <rect x="510" y="15" width="200" height="110" rx="8" fill="#111118" stroke="#1e1e2e" stroke-width="1" filter="url(#shadow)"/>
    <text x="525" y="38" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Risk Posture Score</text>
    <circle cx="610" cy="75" r="28" fill="none" stroke="#7c3aed" stroke-width="4"/>
    <circle cx="610" cy="75" r="28" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="120 60" transform="rotate(-90 610 75)"/>
    <text x="610" y="80" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="16" font-weight="700">73</text>
    <text x="525" y="108" fill="#34d399" font-family="Inter, sans-serif" font-size="11">↑ 8% from last month</text>
  </g>

  <!-- ========== FORM ELEMENTS ========== -->
  <g transform="translate(50, 380)">
    <text x="0" y="0" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Form Elements</text>
    
    <!-- Input -->
    <rect x="0" y="15" width="220" height="38" rx="6" fill="#0a0a0f" stroke="#1e1e2e" stroke-width="1"/>
    <text x="15" y="38" fill="#6b6b80" font-family="Inter, sans-serif" font-size="12">https://target.com</text>
    <text x="0" y="62" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Target URL input</text>
    
    <!-- Select -->
    <rect x="240" y="15" width="180" height="38" rx="6" fill="#0a0a0f" stroke="#1e1e2e" stroke-width="1"/>
    <text x="15" y="38" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12" transform="translate(240, 0)">Standard Scan</text>
    <polygon points="405,32 410,38 415,32" fill="#6b6b80" transform="translate(240, 0)"/>
    <text x="240" y="62" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Scan profile select</text>
    
    <!-- Checkbox -->
    <rect x="450" y="22" width="18" height="18" rx="3" fill="#7c3aed"/>
    <path d="M 454 31 L 458 35 L 464 27" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="478" y="36" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">Authorization acknowledged</text>
    
    <!-- Toggle -->
    <rect x="450" y="55" width="36" height="20" rx="10" fill="#7c3aed"/>
    <circle cx="482" cy="65" r="7" fill="#ffffff"/>
    <text x="495" y="69" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">Enable fuzzing</text>
  </g>

  <!-- ========== NAVIGATION ========== -->
  <g transform="translate(50, 480)">
    <text x="0" y="0" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Navigation</text>
    
    <!-- Sidebar snippet -->
    <rect x="0" y="15" width="180" height="200" rx="8" fill="#08080c" stroke="#1e1e2e" stroke-width="1" filter="url(#shadow)"/>
    <rect x="15" y="25" width="24" height="24" rx="4" fill="#7c3aed"/>
    <text x="48" y="42" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12" font-weight="600">Bug Finder</text>
    
    <text x="15" y="70" fill="#6b6b80" font-family="Inter, sans-serif" font-size="8" font-weight="600">CORE</text>
    <rect x="10" y="78" width="160" height="26" rx="4" fill="#7c3aed15" stroke-left="2px solid #7c3aed"/>
    <text x="40" y="95" fill="#a78bfa" font-family="Inter, sans-serif" font-size="11" font-weight="500">Dashboard</text>
    <text x="15" y="118" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Scans</text>
    <text x="15" y="138" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Findings</text>
    <text x="15" y="158" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Targets</text>
    
    <text x="15" y="178" fill="#6b6b80" font-family="Inter, sans-serif" font-size="8" font-weight="600">ANALYTICS</text>
    <text x="15" y="195" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Executive</text>
    
    <!-- Breadcrumb -->
    <rect x="200" y="15" width="300" height="36" rx="6" fill="#111118" stroke="#1e1e2e" stroke-width="1"/>
    <text x="215" y="38" fill="#6b6b80" font-family="Inter, sans-serif" font-size="12">Operations</text>
    <text x="290" y="38" fill="#6b6b80" font-family="Inter, sans-serif" font-size="12">›</text>
    <text x="310" y="38" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12" font-weight="500">Scan Detail</text>
    
    <!-- Command Palette -->
    <rect x="200" y="65" width="320" height="160" rx="8" fill="#111118" stroke="#1e1e2e" stroke-width="1" filter="url(#shadow)"/>
    <rect x="210" y="75" width="300" height="34" rx="6" fill="#0a0a0f" stroke="#1e1e2e" stroke-width="1"/>
    <text x="225" y="97" fill="#6b6b80" font-family="Inter, sans-serif" font-size="12">Search findings, scans...</text>
    <text x="470" y="97" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">⌘K</text>
    <text x="210" y="125" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10" font-weight="600">PAGES</text>
    <text x="210" y="145" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">▸ Dashboard</text>
    <text x="210" y="165" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">▸ Scans</text>
    <text x="210" y="185" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="12">▸ Findings</text>
    <text x="210" y="205" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10" font-weight="600">FINDINGS</text>
  </g>

  <!-- ========== PROGRESS & STREAMING ========== -->
  <g transform="translate(50, 720)">
    <text x="0" y="0" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Progress & Streaming</text>
    
    <!-- Progress bar -->
    <rect x="0" y="15" width="400" height="24" rx="12" fill="#0a0a0f" stroke="#1e1e2e" stroke-width="1"/>
    <rect x="0" y="15" width="280" height="24" rx="12" fill="#7c3aed"/>
    <text x="200" y="32" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">70% — Running TLS analysis</text>
    
    <!-- Finding stream item -->
    <rect x="0" y="50" width="400" height="50" rx="6" fill="#111118" stroke="#ef444430" stroke-width="1"/>
    <rect x="0" y="50" width="3" height="50" rx="1" fill="#ef4444"/>
    <circle cx="20" cy="65" r="5" fill="#ef4444"/>
    <text x="35" y="68" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="600">CRITICAL</text>
    <text x="100" y="68" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="11">SQL Injection in 'id' Parameter</text>
    <text x="35" y="88" fill="#6b6b80" font-family="'Space Mono', monospace" font-size="9">/api/users    CVSS: 9.8</text>
    
    <!-- AI streaming text -->
    <rect x="420" y="15" width="300" height="85" rx="8" fill="#111118" stroke="#8b5cf630" stroke-width="1" filter="url(#shadow)"/>
    <text x="435" y="35" fill="#8b5cf6" font-family="Inter, sans-serif" font-size="11" font-weight="600">🤖 AI Analysis</text>
    <text x="435" y="55" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="11">This scan reveals a critical</text>
    <text x="435" y="72" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="11">SQL injection vulnerability...</text>
    <rect x="670" y="65" width="8" height="14" fill="#8b5cf6">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Footer -->
  <text x="600" y="880" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="12">
    Bug Finder Pro — Design System Component Reference
  </text>
</svg>
