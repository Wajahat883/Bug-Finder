<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="24" font-weight="700">
    Scan Lifecycle — How a Scan Works
  </text>

  <!-- Step 1: Create -->
  <g transform="translate(50, 80)">
    <rect width="160" height="100" rx="10" fill="#111118" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#7c3aed" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#7c3aed" font-family="Inter, sans-serif" font-size="14" font-weight="700">1</text>
    <text x="85" y="30" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">Create Scan</text>
    <text x="20" y="55" fill="#6b6b80" font-family="'Space Mono', monospace" font-size="10">POST /api/scans</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Target URL + Profile</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Status: queued</text>
  </g>

  <!-- Arrow 1→2 -->
  <path d="M 220 130 L 250 130" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrPurp)"/>

  <!-- Step 2: Queue -->
  <g transform="translate(260, 80)">
    <rect width="160" height="100" rx="10" fill="#111118" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#eab308" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#eab308" font-family="Inter, sans-serif" font-size="14" font-weight="700">2</text>
    <text x="85" y="30" fill="#eab308" font-family="Inter, sans-serif" font-size="14" font-weight="600">Queue Job</text>
    <text x="20" y="55" fill="#6b6b80" font-family="'Space Mono', monospace" font-size="10">node-cron / trigger</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Run pipeline async</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Status: running</text>
  </g>

  <!-- Arrow 2→3 -->
  <path d="M 430 130 L 460 130" stroke="#eab308" stroke-width="2" fill="none" marker-end="url(#arrYel)"/>

  <!-- Step 3: Scan -->
  <g transform="translate(470, 80)">
    <rect width="200" height="100" rx="10" fill="#111118" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#22d3ee" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#22d3ee" font-family="Inter, sans-serif" font-size="14" font-weight="700">3</text>
    <text x="100" y="30" fill="#22d3ee" font-family="Inter, sans-serif" font-size="14" font-weight="600">Run Scan Modules</text>
    <text x="20" y="55" fill="#6b6b80" font-family="'Space Mono', monospace" font-size="9">crawl → headers → tls</text>
    <text x="20" y="70" fill="#6b6b80" font-family="'Space Mono', monospace" font-size="9">sql → xss → cors → zap</text>
    <text x="20" y="85" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">60+ security checks</text>
  </g>

  <!-- Arrow 3→4 -->
  <path d="M 680 130 L 710 130" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrCyan)"/>

  <!-- Step 4: Stream -->
  <g transform="translate(720, 80)">
    <rect width="220" height="100" rx="10" fill="#111118" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#8b5cf6" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#8b5cf6" font-family="Inter, sans-serif" font-size="14" font-weight="700">4</text>
    <text x="115" y="30" fill="#8b5cf6" font-family="Inter, sans-serif" font-size="14" font-weight="600">Stream Results</text>
    <text x="20" y="55" fill="#6b6b80" font-family="'Space Mono', monospace" font-size="10">SSE /api/stream/:id</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Finding events</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Progress updates</text>
  </g>

  <!-- Step 5: AI -->
  <g transform="translate(50, 220)">
    <rect width="220" height="100" rx="10" fill="#111118" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#a78bfa" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="700">5</text>
    <text x="115" y="30" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600">AI Analysis</text>
    <text x="20" y="55" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">POST /api/ai/scan/:id</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Executive summary stream</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Per-finding remediation</text>
  </g>

  <!-- Step 6: Deduplicate -->
  <g transform="translate(300, 220)">
    <rect width="200" height="100" rx="10" fill="#111118" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#10b981" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="14" font-weight="700">6</text>
    <text x="105" y="30" fill="#10b981" font-family="Inter, sans-serif" font-size="14" font-weight="600">Deduplicate</text>
    <text x="20" y="55" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Check fp_suppressions</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Domain + Title + Endpoint</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Mark false positives</text>
  </g>

  <!-- Step 7: SLA -->
  <g transform="translate(530, 220)">
    <rect width="200" height="100" rx="10" fill="#111118" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#f97316" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#f97316" font-family="Inter, sans-serif" font-size="14" font-weight="700">7</text>
    <text x="105" y="30" fill="#f97316" font-family="Inter, sans-serif" font-size="14" font-weight="600">Assign SLA</text>
    <text x="20" y="55" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Critical: 24h</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">High: 72h, Med: 7d</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Low: 30d</text>
  </g>

  <!-- Step 8: Notify -->
  <g transform="translate(760, 220)">
    <rect width="200" height="100" rx="10" fill="#111118" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#ef4444" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="14" font-weight="700">8</text>
    <text x="105" y="30" fill="#ef4444" font-family="Inter, sans-serif" font-size="14" font-weight="600">Notify</text>
    <text x="20" y="55" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Toast notification</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Slack webhook (critical)</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Audit log entry</text>
  </g>

  <!-- Step 9: Report -->
  <g transform="translate(50, 360)">
    <rect width="220" height="100" rx="10" fill="#111118" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#ec4899" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#ec4899" font-family="Inter, sans-serif" font-size="14" font-weight="700">9</text>
    <text x="115" y="30" fill="#ec4899" font-family="Inter, sans-serif" font-size="14" font-weight="600">Generate Report</text>
    <text x="20" y="55" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">GET /api/scans/:id/pdf</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Cover + findings + CVSS</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Executive summary</text>
  </g>

  <!-- Step 10: Remediate -->
  <g transform="translate(300, 360)">
    <rect width="200" height="100" rx="10" fill="#111118" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#34d399" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="700">10</text>
    <text x="105" y="30" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="600">Remediate</text>
    <text x="20" y="55" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Create GitHub Issue</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Track remediation status</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Mark resolved / accepted</text>
  </g>

  <!-- Final State -->
  <g transform="translate(530, 360)">
    <rect width="200" height="100" rx="10" fill="#111118" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="15" fill="#7c3aed" opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#7c3aed" font-family="Inter, sans-serif" font-size="14" font-weight="700">✓</text>
    <text x="105" y="30" fill="#7c3aed" font-family="Inter, sans-serif" font-size="14" font-weight="600">Complete</text>
    <text x="20" y="55" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Status: complete</text>
    <text x="20" y="72" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Risk score calculated</text>
    <text x="20" y="89" fill="#6b6b80" font-family="Inter, sans-serif" font-size="10">Target updated</text>
  </g>

  <!-- Connections between bottom row -->
  <path d="M 275 410 L 295 410" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#arrPink)"/>
  <path d="M 505 410 L 525 410" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrGreen)"/>

  <!-- Vertical connections -->
  <path d="M 160 180 L 160 210" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  <path d="M 400 180 L 400 210" stroke="#eab308" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

  <!-- Legend -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" fill="#e8e8ef" font-family="Inter, sans-serif" font-size="14" font-weight="600">Legend</text>
    <rect x="0" y="15" width="12" height="12" rx="2" fill="#7c3aed"/>
    <text x="20" y="25" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">User Action / Complete</text>
    
    <rect x="200" y="15" width="12" height="12" rx="2" fill="#22d3ee"/>
    <text x="220" y="25" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Scanner Engine</text>
    
    <rect x="400" y="15" width="12" height="12" rx="2" fill="#8b5cf6"/>
    <text x="420" y="25" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Real-Time Stream</text>
    
    <rect x="600" y="15" width="12" height="12" rx="2" fill="#ef4444"/>
    <text x="620" y="25" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Notifications</text>
    
    <line x1="0" y1="45" x2="20" y2="45" stroke="#6b6b80" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="25" y="50" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Background process</text>
    
    <line x1="200" y1="45" x2="220" y2="45" stroke="#6b6b80" stroke-width="2"/>
    <text x="225" y="50" fill="#6b6b80" font-family="Inter, sans-serif" font-size="11">Direct flow</text>
  </g>

  <!-- Footer -->
  <text x="500" y="580" text-anchor="middle" fill="#6b6b80" font-family="Inter, sans-serif" font-size="12">
    Bug Finder Pro — Scan Lifecycle Diagram
  </text>

  <defs>
    <marker id="arrPurp" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrYel" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#eab308"/>
    </marker>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrPink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ec4899"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
  </defs>
</svg>
