services:
  redis:
    image: redis:7-alpine
    container_name: bug-finder-redis
    command: redis-server --save 60 1 --loglevel warning
    # Internal only — no host port binding in production
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - bug-finder-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: bug-finder-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-bugfinder}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-bugfinder_dev_pw}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-bugfinder}
    # Internal only — no host port binding in production
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bug-finder-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: bug-finder-zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY:-zap-api-key-change-me}
      -config api.addrs.addr.name=api-server
      -config api.addrs.addr.regex=false
      -config connection.timeoutInSecs=20
    # Internal only — accessed via api-server, not exposed to host
    expose:
      - "8080"
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:-zap-api-key-change-me}
    networks:
      - bug-finder-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/JSON/core/view/version/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Playwright browser automation service ─────────────────────────────────
  # Enables: DOM XSS detection, authenticated SPA crawling, stored XSS verification
  # Source: https://github.com/your-org/bug-finder-playwright (or build locally)
  playwright:
    image: mcr.microsoft.com/playwright:v1.44.0-jammy
    container_name: bug-finder-playwright
    command: >
      node -e "
        const http = require('http');
        const { chromium } = require('playwright-core');
        const START_TIME = Date.now();
        const server = http.createServer(async (req, res) => {
          if (req.url === '/health' && req.method === 'GET') {
            res.writeHead(200, { 'Content-Type': 'application/json' });
            return res.end(JSON.stringify({ status: 'ok', uptime: (Date.now() - START_TIME) / 1000 }));
          }
          const chunks = [];
          req.on('data', d => chunks.push(d));
          req.on('end', async () => {
            try {
              const body = JSON.parse(Buffer.concat(chunks).toString() || '{}');
              const browser = await chromium.launch({ args: ['--no-sandbox'] });
              const page = await browser.newPage();
              if (req.url === '/crawl') {
                await page.goto(body.url, { waitUntil: 'networkidle', timeout: 25000 });
                const links = await page.evaluate(() => [...new Set([...document.querySelectorAll('a[href]')].map(a => a.href))]);
                const apiCalls = [];
                await browser.close();
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ links, apiCalls }));
              } else if (req.url === '/check-xss') {
                let executed = false;
                page.on('dialog', async d => { if (d.message().includes(body.marker)) executed = true; await d.dismiss(); });
                await page.goto(body.url, { timeout: 8000 }).catch(() => {});
                await browser.close();
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ executed }));
              } else if (req.url === '/scan') {
                const findings = [];
                const console_errors = [];
                const dom_xss_sinks = [];
                page.on('console', m => { if (m.type() === 'error') console_errors.push({ message: m.text() }); });
                await page.goto(body.url, { waitUntil: 'networkidle', timeout: 25000 });
                const local_storage_keys = await page.evaluate(() => Object.keys(localStorage)).catch(() => []);
                const title = await page.title().catch(() => '');
                await browser.close();
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ findings, dom_xss_sinks, local_storage_keys, console_errors, title }));
              } else {
                await browser.close().catch(() => {});
                res.writeHead(404); res.end();
              }
            } catch(e) { res.writeHead(500); res.end(e.message); }
          });
        });
        server.listen(3005, () => console.log('Playwright service on :3005'));
      "
    expose:
      - "3005"
    networks:
      - bug-finder-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Nuclei template scanner service ──────────────────────────────────────────
  nuclei:
    build:
      context: ./nuclei-service
      dockerfile: Dockerfile
    container_name: bug-finder-nuclei
    environment:
      PORT: 8088
      NUCLEI_TEMPLATES_DIR: /home/nuclei/nuclei-templates
      MAX_CONCURRENT_SCANS: ${NUCLEI_MAX_CONCURRENT:-3}
      NUCLEI_RATE_LIMIT: ${NUCLEI_RATE_LIMIT:-150}
    expose:
      - "8088"
    volumes:
      - nuclei_templates:/home/nuclei/nuclei-templates
    networks:
      - bug-finder-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Interactsh OOB server — confirms blind SQLi/SSRF/XSS via callback ─────
  interactsh:
    image: projectdiscovery/interactsh-server:latest
    container_name: bug-finder-interactsh
    command: >
      -domain ${INTERACTSH_DOMAIN:-oast.local}
      -http-port 8194
      -token ${INTERACTSH_TOKEN:-dev-interactsh-token}
      -debug
    expose:
      - "8193"
      - "8194"
    networks:
      - bug-finder-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8194/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bug-finder-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER:-bugfinder}:${MONGO_PASSWORD:-bugfinder_dev_pw}@mongodb:27017/${MONGO_DB:-bugfinder}?authSource=admin
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_API_BASE: ${OPENCODE_API_BASE:-https://opencode.ai/zen/v1}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-nemotron-3-super-free}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-50000}
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      JIRA_URL: ${JIRA_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production}
      ZAP_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY:-zap-api-key-change-me}
      PLAYWRIGHT_URL: http://playwright:3005
      INTERACTSH_URL: http://interactsh:8194
      NUCLEI_URL: http://nuclei:8088
      NUCLEI_BINARY: /usr/local/bin/nuclei
      NUCLEI_TEMPLATES_DIR: /home/appuser/nuclei-templates
      INTERACTSH_TOKEN: ${INTERACTSH_TOKEN:-dev-interactsh-token}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@bugfinder.io}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bugfinder.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CREDENTIAL_VAULT_KEY: ${CREDENTIAL_VAULT_KEY:-dev-credential-vault-key-min-32-chars!}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-dev-webhook-secret-key-32-chars!!}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-5}
      SAML_ENTRY_POINT: ${SAML_ENTRY_POINT:-}
      SAML_CALLBACK_URL: ${SAML_CALLBACK_URL:-}
      SAML_ISSUER: ${SAML_ISSUER:-bugfinder}
      SAML_IDP_CERT: ${SAML_IDP_CERT:-}
      SAML_PRIVATE_KEY: ${SAML_PRIVATE_KEY:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Bug Finder}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:5173}
      MULTI_TENANT: ${MULTI_TENANT:-false}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nuclei:
        condition: service_healthy
    networks:
      - bug-finder-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bug-finder-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-server
    networks:
      - bug-finder-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.25-alpine
    container_name: bug-finder-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-server
      - frontend
    networks:
      - bug-finder-network
    restart: unless-stopped
    profiles:
      - production

  mongo-backup:
    image: mongo:7-jammy
    container_name: bug-finder-backup
    entrypoint: >
      sh -c "
        while true; do
          sleep 86400;
          mongodump --uri=\"mongodb://${MONGO_USER:-bugfinder}:${MONGO_PASSWORD:-password123}@mongodb:27017/${MONGO_DB:-bugfinder}?authSource=admin\" --out=/backups/dump_\$(date +%Y%m%d_%H%M%S) --gzip;
          find /backups -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +;
          echo \"Backup completed at \$(date)\";
        done
      "
    volumes:
      - mongo_backups:/backups
    networks:
      - bug-finder-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: bug-finder-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - bug-finder-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: bug-finder-grafana
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-grafana}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - bug-finder-network
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_backups:
  grafana_data:
  redis_data:
  nuclei_templates:

networks:
  bug-finder-network:
    driver: bridge
